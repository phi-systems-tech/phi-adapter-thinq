# Points an enrolling LG appliance at the box (docs/thinq-protocol.md §6).
# Copy to /etc/dnsmasq.d/thinq.conf, fill in the box address and the
# appliance MACs, then `systemctl reload dnsmasq`.
#
# The module asks for its bootstrap host over plain DNS and accepts any
# certificate for that one request; from then on it resolves the name
# /route gave it (PHI_THINQ_HOST). Both spellings of the bootstrap host are
# in the notes; a capture of our module's query settles which (§7.3).
address=/common.lgthinq.com/192.168.18.76
address=/comon.lgthinq.com/192.168.18.76
address=/phi-box.lan/192.168.18.76
# The module ignores a TTL of 0; give it a real one.
local-ttl=60

# Only the appliances get the box as their resolver; everyone else keeps the
# router's DHCP answer.
dhcp-host=b8:16:5f:30:bb:c8,set:thinq
dhcp-host=14:7f:67:cf:d3:24,set:thinq
dhcp-option=tag:thinq,6,192.168.18.76
