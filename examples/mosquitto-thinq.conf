# The listener an LG ThinQ appliance connects to once the box is its cloud
# (docs/thinq-protocol.md §6). Copy to /etc/mosquitto/conf.d/thinq.conf after
# phi-thinq-routed has minted the certificates in /var/lib/phi/thinq, and make
# sure mosquitto can read server.key (it is 0640 phi:phi; add the mosquitto
# user to the phi group, or copy the files).
#
# Identity is the client certificate the box issued: its CN is the device
# uuid, which becomes the username, and the ACL below keeps every appliance
# to its own topics. The adapter itself stays on the local 1883 listener
# with its own account (acl: readwrite clip/#, $aws/#, lime/#).
listener 8883
protocol mqtt
cafile /var/lib/phi/thinq/ca.crt
certfile /var/lib/phi/thinq/server.crt
keyfile /var/lib/phi/thinq/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
# The modules' suites; the exact list is what the capture of their ClientHello
# says, this is the superset of the notes.
ciphers ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:@SECLEVEL=0

# Append to the acl_file the adapter's account and the per-device pattern:
#
#   user <adapter-account>
#   topic readwrite clip/#
#   topic readwrite $aws/#
#   topic readwrite lime/#
#
#   pattern write clip/provisioning/devices/%u
#   pattern write clip/provisioning/devices/%u/#
#   pattern write $aws/rules/+/clip/devices/%u/#
#   pattern write $aws/rules/+/clip/provisioning/devices/%u
#   pattern read lime/devices/%u
